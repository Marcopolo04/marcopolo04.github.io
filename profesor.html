<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel del Profesor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial; }
        body { background: #1e3c72; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; }
        h1 { color: #1e3c72; margin-bottom: 20px; }
        textarea { width: 100%; height: 300px; font-family: monospace; padding: 10px; }
        .btn { background: #1e3c72; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #1e3c72; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Panel del Profesor</h1>
        <p><a href="index.html">← Volver al inicio</a></p>

        <h2>Resultados de Estudiantes</h2>
        <div id="resultados"></div>

        <script>
            function mostrarResultados() {
                const resultados = JSON.parse(localStorage.getItem('resultadosEstudiantes')) || [];
                let html = '<table><tr><th>Nombre</th><th>Área</th><th>Fecha</th><th>Calificación</th></tr>';
                if (resultados.length === 0) {
                    html = '<p>No hay resultados aún. Los estudiantes deben tomar un examen primero.</p>';
                } else {
                    resultados.forEach(r => {
                        html += `<tr><td>${r.nombre}</td><td>${r.area || 'Matemáticas'}</td><td>${r.fecha}</td><td><strong>${r.calificacion}%</strong></td></tr>`;
                    });
                    html += '</table>';
                }
                document.getElementById('resultados').innerHTML = html;
            }
            mostrarResultados();
        </script>
    </div>
</body>
</html>
